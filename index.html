<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Showcase</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff;
}

.video-showcase {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
}

/* Featured Timeline 1 */
.featured-video {
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
}

.featured-video video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

/* Reels */
.reels-grid {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 30px;
}

.reel {
  width: 100%;
  aspect-ratio: 9 / 16;
  overflow: hidden;
}

.reel video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

/* Mobile */
@media (max-width: 768px) {
  .video-showcase {
    padding: 0 16px;
  }

  .reels-grid {
    grid-template-columns: 1fr;
    gap: 18px;
    margin-top: 24px;
  }
}
</style>
</head>

<body>

<section class="video-showcase">

  <!-- TIMELINE 1 — FEATURED LANDSCAPE VIDEO -->
  <div class="featured-video">
    <video
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      aria-label="Timeline 1"
    >
      <source src="Timeline_1_web_visually_lossless.mp4" type="video/mp4">
    </video>
  </div>

  <!-- REELS -->
  <div class="reels-grid">

    <div class="reel">
      <video autoplay muted loop playsinline preload="metadata">
        <source src="austin-home.mp4" type="video/mp4">
      </video>
    </div>

    <div class="reel">
      <video autoplay muted loop playsinline preload="metadata">
        <source src="nyc-design.mp4" type="video/mp4">
      </video>
    </div>

    <div class="reel">
      <video autoplay muted loop playsinline preload="metadata">
        <source src="bath-design.mp4" type="video/mp4">
      </video>
    </div>

  </div>

</section>

<script>
document.querySelectorAll("video").forEach(video => {
  video.muted = true;
  video.setAttribute("muted", "");
  video.setAttribute("playsinline", "");

  const playVideo = () => {
    video.play().catch(() => {});
  };

  if (video.readyState >= 2) {
    playVideo();
  } else {
    video.addEventListener("canplay", playVideo, { once: true });
  }
});
</script>

</body>
</html>
