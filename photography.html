</section><footer class="foot"><span>Gaurank Mishra · Photography</span><span>Eight photographs</span></footer></main><div class="lightbox" id="lightbox" role="dialog" aria-label="Expanded photograph"><button class="close" aria-label="Close image">×</button><img id="lightbox-img" alt=""></div><script>const box=document.getElementById('lightbox'),big=document.getElementById('lightbox-img');document.querySelectorAll('.card img').forEach(img=>img.addEventListener('click',()=>{big.src=img.src;big.alt=img.alt;box.classList.add('open')}));function closeBox(){box.classList.remove('open');big.src=''}box.querySelector('.close').addEventListener('click',closeBox);box.addEventListener('click',e=>{if(e.target===box)closeBox()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBox()});</script></body></html>
